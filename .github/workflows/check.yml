name: Check

on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install function dependencies
        run: npm ci
        working-directory: functions

      - name: Syntax check
        run: |
          node --check functions/index.js functions/gemini.js functions/rules.js functions/upi.js
          node --check web/app.js

      - name: Rules smoke test
        working-directory: functions
        run: |
          node -e "
          const { runRules } = require('./rules');
          const { parseUpi } = require('./upi');
          const ctx = { on_call: false, new_payee: false, typical_amount: 2000 };
          const ok = runRules(parseUpi('upi://pay?pa=shop@okaxis&pn=Shop&am=500&tn=Order'), ctx, 0);
          const scam = runRules(parseUpi('upi://pay?pa=x@ybl&pn=Refund%20Desk&am=5000&tn=enter%20UPI%20PIN%20to%20receive'), ctx, 0);
          if (ok.floor !== 'PROCEED' || scam.floor !== 'BLOCK') { console.error({ ok, scam }); process.exit(1); }
          console.log('rules ok');
          "
