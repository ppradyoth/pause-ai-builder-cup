name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install function dependencies
        run: npm ci
        working-directory: functions

      - name: Syntax check
        run: |
          node --check functions/index.js functions/gemini.js functions/rules.js functions/upi.js
          node --check web/app.js

      # Keyless: GitHub OIDC -> Workload Identity Federation -> github-deployer SA.
      # Only main of ppradyoth/pause-ai-builder-cup can mint credentials; nothing is stored in repo secrets.
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/971470694500/locations/global/workloadIdentityPools/github/providers/github-repo
          service_account: github-deployer@pause-aibuildercup-26.iam.gserviceaccount.com

      - name: Deploy to Firebase
        run: npx --yes firebase-tools@15.30.0 deploy --only hosting,functions,firestore:rules --project pause-aibuildercup-26 --force --non-interactive
